
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>VetAdmin | Sistema Veterinario</title>

    <!-- Bootstrap -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
    >

    <!-- Iconos -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
            rel="stylesheet"
    >

    <!-- Nuestros estilos -->
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>

<div class="app-container">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">

        <div class="sidebar-brand">
            <i class="bi bi-heart-pulse-fill"></i>
            <span>VetAdmin</span>
        </div>

        <div class="sidebar-section">MENÚ PRINCIPAL</div>

        <nav class="sidebar-nav">

            <a href="#inicio"
               class="nav-link-custom active"
               data-page="inicio">
                <i class="bi bi-house-door"></i>
                <span>Inicio</span>
            </a>

            <a href="#consultas-medicas"
                class="nav-link-custom"
                data-page="consultas-medicas">
                <i class="bi bi-clipboard2-pulse"></i>
                <span>Consultas médicas</span>
            </a>

            <a href="#turnos"
               class="nav-link-custom"
               data-page="turnos">
                <i class="bi bi-calendar-check"></i>
                <span>Turnos</span>
            </a>

      <a href="#estudios"
   class="nav-link-custom"
   data-page="estudios">

    <i class="bi bi-clipboard2-pulse"></i>
    <span>Estudios complementarios</span>

</a>

           
            

             <a href="#clientes"
               class="nav-link-custom"
               data-page="clientes">
                <i class="bi bi-people"></i>
                <span>Clientes</span>
            </a>


            <a href="#mascotas"
               class="nav-link-custom"
               data-page="mascotas">
                <i class="bi bi-heart"></i>
                <span>Mascotas</span>
            </a>

           
            

            <a href="#veterinarios"
             class="nav-link-custom"
             data-page="veterinarios">
             <i class="bi bi-heart-pulse"></i>
             <span>Veterinarios</span>
            </a>

        </nav>

        <div class="sidebar-footer">
            <i class="bi bi-shield-check"></i>
            <span>Sistema de Gestión Veterinaria</span>
        </div>

    </aside>

    <!-- CONTENIDO PRINCIPAL -->
    <div class="main-wrapper">

        <!-- NAVBAR SUPERIOR -->
        <header class="topbar">

            <button
                    class="btn btn-light sidebar-toggle"
                    id="sidebarToggle"
                    aria-label="Mostrar u ocultar menú">
                <i class="bi bi-list"></i>
            </button>

            <div class="topbar-title">
                Panel administrativo
            </div>

            <button
    type="button"
    class="topbar-user"
    id="btnPerfilUsuario"
    aria-label="Abrir mi cuenta">

    <div class="user-avatar">
        <i class="bi bi-person-fill"></i>
    </div>

    <div class="user-info">
        <strong>Mi cuenta</strong>
        <small>Perfil y gestión</small>
    </div>

    <i class="bi bi-chevron-down"></i>

</button>
            <button id="btnCerrarSesion"
                    type="button"
                    class="btn btn-outline-secondary btn-sm ms-2">
                <i class="bi bi-box-arrow-right"></i>
                Salir
            </button>

        </header>

        <!-- ACÁ CAMBIARÁ EL CONTENIDO -->
        <main id="app-content" class="main-content">
            <p>Cargando...</p>
        </main>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="/js/app.js"></script>




</body>
</html>
