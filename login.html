
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Ingresar | VetAdmin</title>

  <link
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

  <link
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
          rel="stylesheet">

  <link rel="stylesheet" href="/css/styles.css">
</head>

<body class="login-page">

<main class="login-container">
  <div class="login-card">

    <div class="login-brand">
      <div class="login-logo">
        <i class="bi bi-heart-pulse-fill"></i>
      </div>

      <h1>VetAdmin</h1>
      <p>Gestión veterinaria</p>
    </div>

    <div class="mb-4">
      <h2 class="h4 fw-bold">Iniciar sesión</h2>
      <p class="text-secondary mb-0">
        Ingresá tus credenciales para continuar.
      </p>
    </div>

    <div id="mensajeLogin"></div>

    <form id="formLogin">

      <div class="mb-3">
        <label for="usuario" class="form-label">
          Usuario
        </label>

        <div class="input-group">
                        <span class="input-group-text bg-white">
                            <i class="bi bi-person"></i>
                        </span>

          <input
                  type="text"
                  class="form-control"
                  id="usuario"
                  name="username"
                  placeholder="Tu usuario"
                  autocomplete="username"
                  required>
        </div>
      </div>

      <div class="mb-4">
        <label for="password" class="form-label">
          Contraseña
        </label>

        <div class="input-group">
                        <span class="input-group-text bg-white">
                            <i class="bi bi-lock"></i>
                        </span>

          <input
                  type="password"
                  class="form-control"
                  id="password"
                  name="password"
                  placeholder="Tu contraseña"
                  autocomplete="current-password"
                  required>
        </div>
      </div>

      <button
              type="submit"
              class="btn btn-success w-100 py-2"
              id="btnLogin">

        <i class="bi bi-box-arrow-in-right me-2"></i>
        Ingresar
      </button>

    </form>

    <p class="text-secondary text-center small mt-4 mb-0">
      VetAdmin · Sistema de gestión veterinaria
    </p>

  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="/js/login.js"></script>

</body>
</html>
